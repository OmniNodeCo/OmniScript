[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscript-lang"
version = "0.2.1"
description = "The reference interpreter and toolchain for the OmniScript programming language"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OmniNodeCo"}]
keywords = ["language", "interpreter", "omniscript", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
omni = "omniscript.cli:main"
omniscript = "omniscript.cli:main"

[project.urls]
Homepage = "https://github.com/OmniNodeCo/OmniScript"
Documentation = "https://github.com/OmniNodeCo/OmniScript/tree/main/docs"
Issues = "https://github.com/OmniNodeCo/OmniScript/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
