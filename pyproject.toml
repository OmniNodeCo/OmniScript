[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscript-lang"
version = "1.0.0"
description = "OmniScript: a small language for doing big things in few lines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["language", "interpreter", "scripting", "dsl"]

[project.scripts]
omniscript = "omniscript.cli:main"
omni = "omniscript.cli:main"

[project.urls]
Homepage = "https://github.com/OmniNodeCo/OmniScript"

[tool.setuptools]
packages = ["omniscript", "omniscript.stdlib"]

[tool.setuptools.package-data]
omniscript = ["std/*.omni"]
