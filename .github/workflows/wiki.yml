# Publish wiki/ to the GitHub wiki.
#
# The wiki pages live in the repository (wiki/Home.md and friends) so they are
# reviewed like any other change; this workflow copies them into the wiki repo
# whenever they change on main. The wiki must be enabled in Settings for the
# push to land -- until then this job reports what it would have done.

name: wiki

on:
  push:
    branches: ["main"]
    paths: ["wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  sync:
    name: Sync the wiki
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Push wiki/ to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          rm -rf /tmp/wiki-sync
          if ! git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${repo}.wiki.git" /tmp/wiki-sync 2>/tmp/wiki-err.txt; then
            echo "::warning::the wiki repo could not be cloned -- enable Wikis in Settings, then re-run this workflow"
            head -5 /tmp/wiki-err.txt || true
            echo "would have published:"
            ls wiki/*.md
            exit 0
          fi
          cp wiki/*.md /tmp/wiki-sync/
          cd /tmp/wiki-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "the wiki is already up to date"
            exit 0
          fi
          git commit --quiet -m "sync wiki from ${{ github.sha }}"
          git push --quiet origin HEAD:master
          echo "wiki updated"
