# Release for OmniScript 1.0.0 — native installers EXE DMG DEB RPM — OS integrated type omni and reacts
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Tag matches VERSION
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="$(cat VERSION | tr -d ' \t\n\r')"
          echo "tag=$tag VERSION=$ver"
          if [ "$tag" != "v$ver" ]; then
            echo "::error::tag $tag does not match VERSION $ver"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -euo pipefail
          make
          ./omni --version
          sh tests/run.sh ./omni

  binaries:
    name: Binaries + Installers (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install deps Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libx11-dev dpkg-dev rpm || true
      - name: Install Inno Setup Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Checking ISCC"
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($iscc) { Write-Host "ISCC at $($iscc.Source)" }
          else {
            Write-Host "Installing Inno Setup via choco"
            choco install innosetup --yes --no-progress
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $p = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $p) {
              $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
              Write-Host "Added $p to PATH"
            }
          }
          Get-Command iscc -ErrorAction SilentlyContinue | Format-List
          Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\" -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table
      - name: Build omni
        shell: bash
        run: |
          set -euo pipefail
          if command -v make >/dev/null 2>&1; then MK=make; elif command -v mingw32-make >/dev/null 2>&1; then MK=mingw32-make; else MK=gmake; fi
          $MK
          if [ -f ./omni.exe ]; then ./omni.exe --version; else ./omni --version; fi
          ls -lh omni* || true
      - name: Platform binary name
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ needs.verify.outputs.version }}"
          uname_s="$(uname -s)"
          uname_m="$(uname -m)"
          os_lc="$(echo "$uname_s" | tr '[:upper:]' '[:lower:]')"
          arch_lc="$(echo "$uname_m" | tr '[:upper:]' '[:lower:]')"
          case "$os_lc" in linux*) os=linux;; darwin*|mac*) os=macos;; mingw*|msys*|cygwin*) os=windows;; *) os="$os_lc";; esac
          case "$arch_lc" in x86_64|amd64) arch=x86_64;; aarch64|arm64) arch=arm64;; i386|i686) arch=x86;; *) arch="$arch_lc";; esac
          plat="${os}-${arch}"
          suffix=""; case "${{ matrix.os }}" in *windows*) suffix=".exe";; esac
          mkdir -p dist
          if [ -f omni.exe ]; then src=omni.exe; else src=omni; fi
          name="omni-${plat}${suffix}"
          cp "$src" "dist/$name"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "dist/$name" | awk '{print $1}' > "dist/$name.sha256"; else shasum -a 256 "dist/$name" | awk '{print $1}' > "dist/$name.sha256"; fi
          ls -l dist/
      - name: Build DEB + RPM + tarball (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ./installer/linux/build-deb.sh
          ./installer/linux/build-rpm.sh || echo "RPM build failed or skipped"
          ls -lh dist/
      - name: Build DMG + PKG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ./installer/macos/build-dmg.sh
          ls -lh dist/
      - name: Build EXE installer (Windows) - bash
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ needs.verify.outputs.version }}"
          echo "=== Building EXE via bash, ver $ver ==="
          ls -lh
          ls -lh installer/windows/
          echo "Checking omni.exe"
          if [ -f omni.exe ]; then ./omni.exe --version || true; else echo "omni.exe missing"; fi
          # Try ISCC
          export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
          if command -v iscc >/dev/null 2>&1; then
            echo "iscc found at $(which iscc)"
            iscc /DMyAppVersion=$ver installer/windows/OmniScript.iss || echo "iscc via bash failed but continuing"
          else
            echo "iscc not in bash PATH, trying direct"
            if [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
              "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /DMyAppVersion=$ver installer/windows/OmniScript.iss || echo "direct ISCC failed but continuing"
            else
              echo "ISCC.exe not found"
            fi
          fi
          ls -lh dist/ || true
      - name: Build EXE installer (Windows) - pwsh
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $ver = "${{ needs.verify.outputs.version }}"
          Write-Host "=== Building EXE via pwsh, ver $ver ==="
          if (Test-Path omni.exe) { try { & ./omni.exe --version } catch { Write-Host "omni --version failed" } } else { Write-Host "omni.exe missing" }
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $p = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $p) { $iscc = Get-Item $p; Write-Host "Found $p" }
          }
          if ($iscc) {
            Write-Host "Building with $($iscc.Source)"
            New-Item -ItemType Directory -Force -Path dist | Out-Null
            try {
              & $iscc.Source "/DMyAppVersion=$ver" "installer/windows/OmniScript.iss"
              Write-Host "ISCC exit: $LASTEXITCODE"
            } catch {
              Write-Host "ISCC threw: $_"
            }
            Get-ChildItem dist -Force | Format-Table
          } else {
            Write-Host "ISCC not found"
          }
          # Fallback: if EXE not built, create zip as installer fallback
          $exe = "dist/OmniScript-$ver-Windows-x86_64-Setup.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "EXE installer not found at $exe, creating ZIP fallback"
            try {
              Compress-Archive -Path omni.exe, README.md, LICENSE, examples -DestinationPath "dist/OmniScript-$ver-Windows-x86_64.zip" -Force
            } catch {
              Write-Host "Compress-Archive failed: $_"
              # Try simpler zip
              Compress-Archive -Path omni.exe -DestinationPath "dist/OmniScript-$ver-Windows-x86_64.zip" -Force
            }
          }
          Get-ChildItem dist | Format-Table
          Write-Host "Windows build step completed (continue-on-error)"
          exit 0
      - name: List dist final
        shell: bash
        run: |
          echo "=== Final dist ==="
          ls -lhR dist/ || true
          find dist -type f | sort
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*
          retention-days: 30

  release:
    name: Publish Release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Collect binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt || shasum -a 256 ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh
      - name: Create release with EXE DMG RPM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${{ needs.verify.outputs.version }}"
          repo="${{ github.repository }}"
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<MD
          **OmniScript $ver** — very very very simple. Install into OS, then type \`omni\` in terminal and it reacts.

          ## Install — OS integrated

          ### Windows — EXE (Inno Setup)
          Download \`OmniScript-$ver-Windows-x86_64-Setup.exe\` and run it. Installs to Program Files, adds to PATH (so you can type \`omni\` in terminal), Start Menu + uninstaller.
          After install, open **new** terminal:
          \`\`\`bat
          omni --version
          omni
          \`\`\`

          ### macOS — DMG + PKG
          Download \`OmniScript-$ver-macOS.dmg\`, drag \`OmniScript.app\` to Applications, then double-click \`Install CLI.command\` inside DMG to install \`omni\` to \`/usr/local/bin\`.
          Or \`OmniScript-$ver-macOS.pkg\`: \`sudo installer -pkg OmniScript-$ver-macOS.pkg -target /\`
          \`\`\`bash
          omni --version
          omni
          \`\`\`

          ### Linux — DEB
          \`\`\`bash
          sudo dpkg -i omniscript_${ver}_amd64.deb
          omni --version
          \`\`\`

          ### Linux — RPM
          \`\`\`bash
          sudo rpm -i omniscript-${ver}-1.x86_64.rpm
          sudo dnf install ./omniscript-${ver}-1.x86_64.rpm
          omni --version
          \`\`\`

          After install, typing \`omni\` in terminal reacts immediately.

          Assets:
          - Windows EXE installer (Inno Setup)
          - macOS DMG + PKG
          - Linux DEB + RPM + tarballs
          - Binaries + SHA256SUMS.txt
          MD
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "$tag exists -- uploading assets"
            gh release upload "$tag" dist/* --repo "$repo" --clobber
            gh release edit "$tag" --repo "$repo" --title "OmniScript $ver — OS integrated" --notes-file "$notes"
          else
            gh release create "$tag" dist/* --repo "$repo" --title "OmniScript $ver — OS integrated" --notes-file "$notes"
          fi
          echo "https://github.com/$repo/releases/tag/$tag"
