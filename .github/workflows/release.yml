# Release for OmniScript 2.0.0 — native installers DMG DEB EXE
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v2.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Tag matches VERSION
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="$(cat VERSION | tr -d ' \t\n\r')"
          echo "tag=$tag VERSION=$ver"
          if [ "$tag" != "v$ver" ]; then
            echo "::error::tag $tag does not match VERSION $ver"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -euo pipefail
          make
          ./omni --version
          sh tests/run.sh ./omni

  binaries:
    name: Binaries + Installers (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install deps Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libx11-dev dpkg-dev || true
      - name: Build omni
        shell: bash
        run: |
          set -euo pipefail
          if command -v make >/dev/null 2>&1; then MK=make; elif command -v mingw32-make >/dev/null 2>&1; then MK=mingw32-make; else MK=gmake; fi
          $MK
          if [ -f ./omni.exe ]; then ./omni.exe --version; else ./omni --version; fi
      - name: Platform name
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ needs.verify.outputs.version }}"
          uname_s="$(uname -s)"
          uname_m="$(uname -m)"
          os_lc="$(echo "$uname_s" | tr '[:upper:]' '[:lower:]')"
          arch_lc="$(echo "$uname_m" | tr '[:upper:]' '[:lower:]')"
          case "$os_lc" in linux*) os=linux;; darwin*|mac*) os=macos;; mingw*|msys*|cygwin*) os=windows;; *) os="$os_lc";; esac
          case "$arch_lc" in x86_64|amd64) arch=x86_64;; aarch64|arm64) arch=arm64;; i386|i686) arch=x86;; *) arch="$arch_lc";; esac
          plat="${os}-${arch}"
          suffix=""; case "${{ matrix.os }}" in *windows*) suffix=".exe";; esac
          mkdir -p dist
          if [ -f omni.exe ]; then src=omni.exe; else src=omni; fi
          name="omni-${plat}${suffix}"
          cp "$src" "dist/$name"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "dist/$name" | awk '{print $1}' > "dist/$name.sha256"; else shasum -a 256 "dist/$name" | awk '{print $1}' > "dist/$name.sha256"; fi
          ls -l dist/
      - name: Build DEB + tarball (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ./installer/linux/build-deb.sh
          ./installer/build-all.sh || true
          ls -lh dist/
      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ./installer/macos/build-dmg.sh
          ls -lh dist/
      - name: Build EXE installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            Write-Host "ISCC found, building EXE installer"
            & ./installer/windows/build.ps1
            Get-ChildItem dist -Force | Format-List
          } else {
            Write-Host "ISCC not found, skipping EXE installer build - ISS is still valid"
            if (Test-Path dist) { Get-ChildItem dist -Force }
          }
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*
          retention-days: 30

  release:
    name: Publish Release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Collect binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt || shasum -a 256 ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${{ needs.verify.outputs.version }}"
          repo="${{ github.repository }}"
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<MD
          **OmniScript $ver** — very very very simple.

          Three modules: \`import draw, cmd, pathlib\`

          ## Install

          ### Windows — EXE
          Download \`OmniScript-$ver-Windows-x86_64-Setup.exe\` from assets below and run it. Inno Setup installer, adds to PATH, Start Menu + uninstaller.

          ### macOS — DMG
          Download \`OmniScript-$ver-macOS.dmg\`, open and drag \`OmniScript.app\` to Applications.

          ### Linux — DEB
          \`\`\`bash
          sudo dpkg -i omniscript_${ver}_amd64.deb
          # or
          sudo apt install ./omniscript_${ver}_amd64.deb
          \`\`\`

          ### Tarball
          \`\`\`bash
          tar -xzf omniscript-$ver-linux-amd64.tar.gz
          sudo cp usr/bin/omni /usr/local/bin/
          \`\`\`

          ### Build from source
          \`\`\`bash
          make
          ./omni --version
          \`\`\`

          ## What is OmniScript?

          - \`import draw\` — window, rect, circle, line, text, button, save, show
          - \`import cmd\` — run("ls"), bg("sleep 10")
          - \`import pathlib\` — like Python pathlib

          \`\`\`omni
          import draw, cmd, pathlib
          draw.window(640,400,"Demo")
          draw.rect(0,0,100,50,"red")
          draw.button(20,300,120,30,"List", action="ls -la")
          draw.show()
          \`\`\`

          Assets below include per-platform binaries + installers + SHA256SUMS.txt
          MD
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "$tag exists -- replacing"
            gh release upload "$tag" dist/* --repo "$repo" --clobber
            gh release edit "$tag" --repo "$repo" --title "OmniScript $ver" --notes-file "$notes"
          else
            gh release create "$tag" dist/* --repo "$repo" --title "OmniScript $ver" --notes-file "$notes"
          fi
          echo "https://github.com/$repo/releases/tag/$tag"
