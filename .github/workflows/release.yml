# Release pipeline for OmniScript.
#
# Triggered by pushing a version tag -- v1.2.3 -- or from the Actions tab with
# the name of a tag that already exists.
#
#   verify   the tag, pyproject.toml and the interpreter's own __version__ all
#            agree, then the whole test suite runs once more on that commit
#   build    sdist + wheel, installed into a clean venv and exercised
#   binaries a standalone executable per platform (PyInstaller) plus a zipapp,
#            each one then installed from a rehearsal of this very release and
#            run before it is published
#   assemble everything into one directory and write SHA256SUMS.txt over it
#   release  a GitHub Release carrying the executables, the zipapp, the wheel,
#            the sdist and SHA256SUMS.txt
#   pypi     opt-in upload of the wheel and sdist only; skipped unless the
#            repository asks for it (see the note on that job)
#
# What lands on the release decides how people install: install.sh and
# install.ps1 prefer the executable for their platform, then the zipapp, then
# the wheel -- so the release channel needs no Python at all, and `omni update`
# can replace one of these files in place later.
#
# Cutting a release is therefore:
#
#   1. bump VERSION in omniscript/stdlib/__init__.py and version in
#      pyproject.toml to the same value
#   2. commit, then tag: git tag v1.2.3 && git push origin v1.2.3

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: The tag, the package and the source agree
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(python -c 'import omniscript; print(omniscript.__version__)')"
          echo "tag     = $tag"
          echo "version = $version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match omniscript/__init__.py, which says $version"
            echo "::error::bump VERSION in omniscript/stdlib/__init__.py, or move the tag"
            exit 1
          fi
          python - "$version" <<'PY'
          import pathlib, sys, tomllib

          version = sys.argv[1]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          if project["version"] != version:
              raise SystemExit(
                  f"pyproject.toml says {project['version']}, the interpreter says {version}")
          print("pyproject.toml agrees")
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Interpreter test suite (unittest)
        run: python -m unittest discover -s tests

      - name: Language test suite (./omni test)
        run: ./omni test

      - name: Every example runs
        run: |
          set -euo pipefail
          for f in examples/*.omni; do
            echo "::group::$f"
            ./omni "$f"
            echo "::endgroup::"
          done

      - name: The command line works end to end
        run: |
          set -euo pipefail
          ./omni --version
          ./omni docs | head -1
          ./omni -e 'let c = draw(32, 32)
          c.circle(16, 16, 14, "#2ea043")
          c.save("release-check.png")
          print("graphics ok:", file_info("release-check.png").size, "bytes")'

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      loc: ${{ steps.stats.outputs.loc }}
      builtins: ${{ steps.stats.outputs.builtins }}
      examples: ${{ steps.stats.outputs.examples }}
      cases: ${{ steps.stats.outputs.cases }}
      pythons: ${{ steps.stats.outputs.pythons }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the build front-end
        run: python -m pip install --upgrade pip build

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Install the wheel somewhere clean and use it
        run: |
          set -euo pipefail
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install --quiet dist/*.whl
          version="${{ needs.verify.outputs.version }}"
          # Run from outside the checkout so nothing resolves to local sources.
          cd /tmp
          reported="$(/tmp/relcheck/bin/omni --version | awk '{print $2}')"
          echo "installed wheel reports $reported"
          test -n "$version"
          test "$reported" = "$version" || {
            echo "::error::the wheel reports $reported but the tag says $version"; exit 1; }
          /tmp/relcheck/bin/omni -e 'print("wheel ok:", [1, 2, 3].reduce((a, b) -> a + b))'
          /tmp/relcheck/bin/omniscript -e 'use std/stats
          print("std ok:", stdev([2, 4, 6]))'
          /tmp/relcheck/bin/omni -e 'let c = draw(24, 24)
          c.rect(0, 0, 24, 24, "#2ea043")
          c.save("wheel-check.png")
          print("graphics ok:", file_info("wheel-check.png").size, "bytes")'

      - name: Gather the numbers for the release notes
        id: stats
        run: |
          set -euo pipefail
          loc="$(find omniscript -name '*.py' -print0 | xargs -0 cat | wc -l | tr -d ' ')"
          builtins="$(./omni docs | head -1 | grep -oE '[0-9]+' | tail -1)"
          examples="$(ls -1 examples/*.omni | wc -l | tr -d ' ')"
          cases="$(./omni test 2>&1 | tail -1 | grep -oE '^[0-9]+')"
          # The tested range comes out of build.yml, so the notes cannot drift
          # from the matrix. Plain shell: no PyYAML on a bare setup-python.
          versions="$(grep -oE '"3\.[0-9]+"' .github/workflows/build.yml | tr -d '"' | sort -V -u)"
          pythons="$(printf '%s to %s' "$(echo "$versions" | head -1)" "$(echo "$versions" | tail -1)")"
          {
            echo "loc=$loc"
            echo "builtins=$builtins"
            echo "examples=$examples"
            echo "cases=$cases"
            echo "pythons=$pythons"
          } >> "$GITHUB_OUTPUT"
          echo "$loc lines of Python, $builtins built-ins, $examples examples, $cases test cases"

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 30

  # ---------------------------------------------------------- executables
  binaries:
    name: Executables (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per family. Other architectures -- an Intel Mac, an ARM
        # Windows box, a musl container -- install the zipapp from the same
        # release instead, which is why it is always built here too.
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build the executable and the zipapp
        run: >-
          python tools/build_executable.py
          --out dist
          --version "${{ needs.verify.outputs.version }}"

      - name: Install what was just built, the way a user would
        # Lays dist/ out as a GitHub release on disk, then runs the installer for
        # this platform against it: download, sha256 check, put it in place, run
        # it, let `omni update --check` see its own release, uninstall cleanly.
        run: >-
          python tools/rehearse_release.py
          --dist dist
          --version "${{ needs.verify.outputs.version }}"

      - name: Upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: executables-${{ matrix.os }}
          path: dist/*
          retention-days: 30

  # ------------------------------------------------------------- assemble
  assemble:
    name: Assemble the release
    needs: [verify, build, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Collect the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: release

      - name: Collect the executables
        uses: actions/download-artifact@v8
        with:
          pattern: executables-*
          path: release
          merge-multiple: true

      - name: One checksum file over everything that will be published
        run: |
          set -euo pipefail
          cd release
          # Each platform's build wrote its own; the published one covers them all.
          rm -f SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt
          echo "files in this release:"
          ls -l
          echo
          python - <<'PY'
          import os, pathlib

          here = pathlib.Path(".")
          names = sorted(p.name for p in here.iterdir() if p.is_file())
          sums = pathlib.Path("SHA256SUMS.txt").read_text()
          missing = [n for n in names if n != "SHA256SUMS.txt" and n not in sums]
          if missing:
              raise SystemExit(f"::error::not covered by SHA256SUMS.txt: {missing}")
          print(f"SHA256SUMS.txt covers {len(names) - 1} files")
          for name in names:
              print(f"    {name}  {os.path.getsize(name):,} bytes")
          PY

      - name: Upload everything
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/*
          retention-days: 30

  release:
    name: Publish the GitHub release
    needs: [verify, build, assemble]
    runs-on: ubuntu-latest
    steps:
      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Show what will be attached
        run: ls -l dist

      - name: Describe the files for the notes
        id: files
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/RELEASE_FILES.md"
          : > "$list"
          for f in dist/*; do
            name="$(basename "$f")"
            [ "$name" = "SHA256SUMS.txt" ] && continue
            size="$(du -h "$f" | cut -f1 | tr -d ' ')"
            case "$name" in
              *.whl)       what="wheel -- \`pip install\` it" ;;
              *.tar.gz)    what="source distribution" ;;
              *.pyz)       what="zipapp -- one file, needs Python 3.10 or newer" ;;
              *windows*)   what="Windows executable -- no Python needed" ;;
              *macos*)     what="macOS executable -- no Python needed" ;;
              *linux*)     what="Linux executable -- no Python needed" ;;
              *)           what="artifact" ;;
            esac
            printf -- '- `%s` (%s) -- %s\n' "$name" "$size" "$what" >> "$list"
          done
          echo "path=$list" >> "$GITHUB_OUTPUT"
          cat "$list"

      - name: Write the release notes
        id: notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"
          cat > "$notes" <<'MD'
          **OmniScript __VERSION__** -- a small language for doing big things in
          few lines. No dependencies: it runs on a stock Python 3.10 or newer,
          and the executables attached below need no Python at all.

          ## Install

          One command, and it fetches the executable for your machine from this
          release, checks its sha256 and puts `omni` on your PATH:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/__REPO__/main/install.sh | bash
          ```

          ```powershell
          iwr -use1 https://raw.githubusercontent.com/__REPO__/main/install.ps1 | iex
          ```

          Both default to the **release channel** -- this page. `-s beta`
          (`-Channel beta`) tracks the repository instead, and `--version`
          (`-Version`) pins one release.

          Or install it another way:

          ```bash
          pip install omniscript-lang==__VERSION__    # PyPI, when it is published
          python3 omni-__VERSION__-any.pyz            # the zipapp: one file
          pip install omniscript_lang-__VERSION__-py3-none-any.whl
          ```

          Or skip installing entirely: clone the repository and run `./omni`.

          ## Update

          An install that came from a release updates itself in place:

          ```bash
          omni update --check     # what is published, and what you are on
          omni update             # fetch it, check the sha256, swap it in
          omni update --channel beta --ref main   # follow the repository instead
          ```

          ## Try it

          ```bash
          omni                                   # interactive REPL
          omni docs                              # all __BUILTINS__ built-ins
          omni -e 'print("hello from __VERSION__")'
          omni examples/04_drawing.omni          # writes a real PNG
          ```

          ```
          let c = draw(640, 360)
          c.rect(0, 0, 640, 360, "#0d1117")
          c.circle(320, 180, 90, "#58a6ff")
          c.text(40, 40, "OmniScript", "#ffffff")
          c.save("hello.png")
          ```

          ## What shipped

          - lexer, parser and tree-walking interpreter in __LOC__ lines of
            dependency-free Python
          - __BUILTINS__ built-ins: graphics with a software rasteriser that
            writes real PNGs, shell commands, files, JSON and CSV, HTTP,
            regular expressions, dates, statistics and parallel maps
          - __EXAMPLES__ runnable examples and __CASES__ language test cases,
            all green on Python __PYTHONS__
          - a VS Code extension under `extras/vscode`
          - standalone executables for Linux, Windows and macOS, a zipapp for
            anywhere else, and installers that know how to fetch and verify them

          ## What is attached

          __FILES__

          `SHA256SUMS.txt` covers every one of them:

          ```bash
          sha256sum -c SHA256SUMS.txt
          ```

          Source history for this release:
          https://github.com/__REPO__/commits/__TAG__
          MD
          sed -i \
            -e "s|__VERSION__|${{ needs.verify.outputs.version }}|g" \
            -e "s|__REPO__|${{ github.repository }}|g" \
            -e "s|__TAG__|${{ github.event.inputs.tag || github.ref_name }}|g" \
            -e "s|__LOC__|${{ needs.build.outputs.loc }}|g" \
            -e "s|__BUILTINS__|${{ needs.build.outputs.builtins }}|g" \
            -e "s|__EXAMPLES__|${{ needs.build.outputs.examples }}|g" \
            -e "s|__CASES__|${{ needs.build.outputs.cases }}|g" \
            -e "s|__PYTHONS__|${{ needs.build.outputs.pythons }}|g" \
            -e "/__FILES__/r ${{ steps.files.outputs.path }}" \
            -e "/__FILES__/d" \
            "$notes"
          if grep -q '__' "$notes"; then
            echo "::error::a placeholder was not substituted"
            cat "$notes"
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          cat "$notes"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${{ needs.verify.outputs.version }}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
            echo "$tag already exists -- replacing the files attached to it"
            gh release upload "$tag" dist/* --repo "$repo" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$repo" \
              --title "OmniScript $version" \
              --notes-file "${{ steps.notes.outputs.path }}"
          fi
          echo "::notice::https://github.com/$repo/releases/tag/$tag"
          gh release view "$tag" --repo "$repo"

  pypi:
    name: Publish to PyPI (opt-in)
    needs: [build, release]
    runs-on: ubuntu-latest
    # Off by default, so a tag push never fails on missing PyPI credentials.
    # Two things turn it on:
    #   1. a repository variable PYPI_PUBLISH set to "true" (Settings > Secrets
    #      and variables > Actions > Variables)
    #   2. trusted publishing configured for the project on pypi.org, pointing
    #      at this repository, this workflow file and the "pypi" environment
    # With both in place this job uploads using an OIDC token -- no API key is
    # stored in the repository.
    if: vars.PYPI_PUBLISH == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Keep only what PyPI accepts
        # The executables, the zipapp and SHA256SUMS.txt belong on the GitHub
        # release; PyPI takes the wheel and the sdist.
        run: |
          set -euo pipefail
          find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -print -delete
          if ! ls dist/*.whl > /dev/null 2>&1; then
            echo "::error::there is no wheel to upload"
            exit 1
          fi
          ls -l dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
