# Release pipeline for native OmniScript.
# Triggered by pushing a version tag v1.2.3 or manual dispatch.
#   verify   tag matches VERSION, C builds clean, tests pass
#   binaries per-platform omni + .sha256
#   release  GitHub Release with SHA256SUMS.txt and notes from CHANGELOG.md

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Tag matches VERSION
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="$(cat VERSION | tr -d ' \t\n\r')"
          echo "tag=$tag"
          echo "VERSION file=$ver"
          if [ "$tag" != "v$ver" ]; then
            echo "::error::tag $tag does not match VERSION file $ver"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -euo pipefail
          make
          ./omni --version
          sh tests/run.sh ./omni
          for f in examples/*.omni; do
            echo "::group::$f"
            ./omni "$f" < tests/example_input.txt || ./omni "$f"
            echo "::endgroup::"
          done

  binaries:
    name: Binaries (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Build omni
        run: |
          set -euo pipefail
          make
          ./omni --version
      - name: Name asset like updater expects and hash it
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ needs.verify.outputs.version }}"
          # platform tag logic mirrors src/update.c and install.sh
          uname_s="$(uname -s)"
          uname_m="$(uname -m)"
          os_lc="$(echo "$uname_s" | tr '[:upper:]' '[:lower:]')"
          arch_lc="$(echo "$uname_m" | tr '[:upper:]' '[:lower:]')"
          case "$os_lc" in
            linux*) os=linux ;;
            darwin*|mac*) os=macos ;;
            mingw*|msys*|cygwin*) os=windows ;;
            *) os="$os_lc" ;;
          esac
          case "$arch_lc" in
            x86_64|amd64) arch=x86_64 ;;
            aarch64|arm64) arch=arm64 ;;
            i386|i686) arch=x86 ;;
            *) arch="$arch_lc" ;;
          esac
          plat="${os}-${arch}"
          suffix=""
          case "${{ matrix.os }}" in *windows*) suffix=".exe" ;; esac
          mkdir -p dist
          if [ -f omni.exe ]; then src=omni.exe; else src=omni; fi
          name="omni-${plat}${suffix}"
          cp "$src" "dist/$name"
          # per-binary .sha256 (just the hex, like update.c expects)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/$name" | awk '{print $1}' > "dist/$name.sha256"
          else
            shasum -a 256 "dist/$name" | awk '{print $1}' > "dist/$name.sha256"
          fi
          ls -l dist/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Collect binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS.txt over everything
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt || shasum -a 256 ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${{ needs.verify.outputs.version }}"
          repo="${{ github.repository }}"
          notes="$RUNNER_TEMP/notes.md"
          changes="$RUNNER_TEMP/changes.md"
          # extract changelog section for this version
          awk -v ver="[$ver]" '
            $0 ~ "^## \\[" { if (p) exit; if (index($0, ver)) p=1; next }
            p
          ' CHANGELOG.md > "$changes" || true
          if [ ! -s "$changes" ]; then
            echo "See CHANGELOG.md at $ver." > "$changes"
          fi
          cat > "$notes" <<MD
          **OmniScript $ver** — native, one binary, libc only. No Python, custom hardware I/O.

          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/$repo/main/install.sh | bash
          \`\`\`

          \`\`\`powershell
          iwr -use1 https://raw.githubusercontent.com/$repo/main/install.ps1 | iex
          \`\`\`

          That takes the file built for your machine from this release, checks its \`.sha256\` and puts \`omni\` on PATH. \`-s beta\` builds from source (\`cc\`+\`make\`), \`--version\` pins a release, \`omni update\` keeps it current.

          ## Try it

          \`\`\`bash
          omni --version
          omni -e 'cmd("echo hello from $ver")'
          omni examples/03_drawing.omni
          omni examples/06_gui.omni
          \`\`\`

          ## What changed

          $(cat "$changes")

          Attached below: executables per platform plus per-binary \`.sha256\` and \`SHA256SUMS.txt\` (\`sha256sum -c SHA256SUMS.txt\`).

          Source history: https://github.com/$repo/commits/$tag
          MD
          if grep -q '__' "$notes"; then echo "::error::placeholder left"; exit 1; fi
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "$tag exists -- replacing files and notes"
            gh release upload "$tag" dist/* --repo "$repo" --clobber
            gh release edit "$tag" --repo "$repo" --title "OmniScript $ver" --notes-file "$notes"
          else
            gh release create "$tag" dist/* --repo "$repo" --title "OmniScript $ver" --notes-file "$notes"
          fi
          echo "::notice::https://github.com/$repo/releases/tag/$tag"
