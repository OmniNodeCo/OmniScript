# CI for OmniScript 2.0.0 super simple
name: build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: VERSION semver
        run: |
          cat VERSION
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
      - name: C builds clean
        run: |
          set -euo pipefail
          make clean
          make NO_GUI=1
          ./omni --version
          ./omni -e 'import cmd; cmd.run("echo lint ok")'
          make clean
          make
          ./omni --version
          ./omni -e 'import draw; draw.window(10,10); draw.save("lint.bmp")'
          test -f lint.bmp
      - name: Workflows parse
        run: |
          python3 - <<'PY'
          import pathlib, sys
          try:
              import yaml
          except ImportError:
              print("no yaml, skipping")
              sys.exit(0)
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              doc = yaml.safe_load(path.read_text())
              jobs = doc.get("jobs") or {}
              assert jobs, f"{path}: no jobs"
              for name, job in jobs.items():
                  assert job.get("runs-on"), f"{path}: {name} no runs-on"
                  assert job.get("steps"), f"{path}: {name} no steps"
              print(f"yaml ok -- {path.name}: {', '.join(jobs)}")
          PY

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v7
      - name: Install X11 dev on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libx11-dev || true
      - name: Build omni
        run: |
          set -euo pipefail
          if command -v make >/dev/null 2>&1; then MK=make; elif command -v mingw32-make >/dev/null 2>&1; then MK=mingw32-make; else MK=gmake; fi
          $MK
          if [ -f ./omni.exe ]; then BIN=./omni.exe; else BIN=./omni; fi
          "$BIN" --version
          "$BIN" -e 'import cmd; cmd.run("echo build ok")'
      - name: Test suite (19 checks)
        run: |
          set -euo pipefail
          if [ -f ./omni.exe ]; then BIN=./omni.exe; else BIN=./omni; fi
          sh tests/run.sh "$BIN" 2>&1 | tee test-output.txt
          cat test-output.txt
      - name: Examples run
        run: |
          set -euo pipefail
          if [ -f ./omni.exe ]; then BIN=./omni.exe; else BIN=./omni; fi
          for f in examples/*.omni; do
            echo "::group::$f"
            "$BIN" "$f" < tests/example_input.txt || true
            echo "::endgroup::"
          done
      - name: BMP valid
        run: |
          set -euo pipefail
          if [ -f ./omni.exe ]; then BIN=./omni.exe; else BIN=./omni; fi
          "$BIN" -e 'import draw; draw.window(48,32,"ci"); draw.rect(0,0,48,32,"#1f6feb"); draw.circle(24,16,10,"white"); draw.text(4,4,"ci","black",10); draw.save("ci-check.bmp")'
          test -f ci-check.bmp
          python3 - <<'PY'
          import struct, pathlib
          data=pathlib.Path("ci-check.bmp").read_bytes()
          assert data[:2]==b"BM"
          w=struct.unpack("<I", data[18:22])[0]
          h=struct.unpack("<I", data[22:26])[0]
          print(f"BMP ok {w}x{h} {len(data)} bytes")
          PY
      - name: Upload on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt
          retention-days: 3

  installer:
    name: Installers (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v7
      - name: Install X11 dev on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libx11-dev dpkg-dev || true
      - name: Build omni
        shell: bash
        run: |
          set -euo pipefail
          if command -v make >/dev/null 2>&1; then MK=make; elif command -v mingw32-make >/dev/null 2>&1; then MK=mingw32-make; else MK=gmake; fi
          $MK
          ./omni --version || ./omni.exe --version
      - name: Build DEB (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ./installer/linux/build-deb.sh
          ls -lh dist/
      - name: Build DMG / tarball (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./installer/macos/build-dmg.sh
          ls -lh dist/
      - name: Check Inno Setup script (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cat installer/windows/OmniScript.iss
          if [ -f ./omni.exe ]; then echo "omni.exe exists"; else echo "building exe"; make; fi
          ls -lh
          echo "ISS syntax ok - requires ISCC to build EXE installer on Windows"
      - name: Test build-all.sh
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ./installer/build-all.sh
          ls -lh dist/
          cat dist/SHA256SUMS.txt || true
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          retention-days: 3

  binaries:
    name: Binaries (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v7
      - name: Install X11 dev on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libx11-dev || true
      - name: Build omni
        shell: bash
        run: |
          set -euo pipefail
          if command -v make >/dev/null 2>&1; then MK=make; elif command -v mingw32-make >/dev/null 2>&1; then MK=mingw32-make; else MK=gmake; fi
          $MK
          if [ -f ./omni.exe ]; then BIN=./omni.exe; else BIN=./omni; fi
          "$BIN" --version
          "$BIN" -e 'import draw; draw.window(64,32,"bin"); draw.rect(0,0,64,32,"blue"); draw.save("bin-check.bmp")'
          test -f bin-check.bmp
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ver="$(cat VERSION)"
          uname_s="$(uname -s)"
          uname_m="$(uname -m)"
          os_lc="$(echo "$uname_s" | tr '[:upper:]' '[:lower:]')"
          arch_lc="$(echo "$uname_m" | tr '[:upper:]' '[:lower:]')"
          case "$os_lc" in linux*) os=linux;; darwin*|mac*) os=macos;; mingw*|msys*|cygwin*) os=windows;; *) os="$os_lc";; esac
          case "$arch_lc" in x86_64|amd64) arch=x86_64;; aarch64|arm64) arch=arm64;; i386|i686) arch=x86;; *) arch="$arch_lc";; esac
          plat="${os}-${arch}"
          suffix=""; case "${{ matrix.os }}" in *windows*) suffix=".exe";; esac
          mkdir -p dist
          if [ -f omni.exe ]; then bin=omni.exe; else bin=omni; fi
          name="omni-${plat}${suffix}"
          cp "$bin" "dist/$name"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "dist/$name" | awk '{print $1}' > "dist/$name.sha256"; else shasum -a 256 "dist/$name" | awk '{print $1}' > "dist/$name.sha256"; fi
          ls -l dist/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*
          retention-days: 3
