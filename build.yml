name: Build and release native executables

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install OmniScript
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check examples
        run: omni check examples/hello.omni examples/tour.omni examples/fibonacci.omni examples/json_report.omni examples/lib/statistics.omni
      - name: Run OmniScript tests
        run: omni test examples/tests
      - name: Toolchain doctor
        run: omni doctor

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary_name: omni-linux-x86_64
            asset: omni-linux-x86_64
          - os: ubuntu-22.04-arm
            binary_name: omni-linux-arm64
            asset: omni-linux-arm64
          - os: windows-latest
            binary_name: omni-windows-x86_64
            asset: omni-windows-x86_64.exe
          - os: windows-11-arm
            binary_name: omni-windows-arm64
            asset: omni-windows-arm64.exe
          - os: macos-15-intel
            binary_name: omni-macos-x86_64
            asset: omni-macos-x86_64
          - os: macos-14
            binary_name: omni-macos-arm64
            asset: omni-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build and smoke-test executable
        run: python scripts/build_executable.py --name "${{ matrix.binary_name }}" --asset "${{ matrix.asset }}" --output artifacts
      - name: Ad-hoc sign macOS binary
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "artifacts/${{ matrix.asset }}"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifacts/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum omni-* > SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/omni-*
            release/SHA256SUMS
